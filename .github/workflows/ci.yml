name: CI

on:
  pull_request:
  push:
    branches: [main]

# Un push nuevo sobre la misma rama cancela la corrida anterior: nadie espera el resultado
# de un commit que ya quedó viejo.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend (ruff + pytest)
    runs-on: ubuntu-latest

    services:
      # pgvector, NO postgres pelado: el catálogo usa la extensión y la migración 0001 falla
      # sin ella. Misma imagen que docker-compose.yml para que CI y dev prueben lo mismo.
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 10

    env:
      # fastembed baja ~120MB la primera vez que algo embebe. Sin esto cachearía en un tmpdir
      # que se evapora entre corridas.
      FASTEMBED_CACHE_PATH: ${{ github.workspace }}/.fastembed_cache

    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Cache del modelo de embeddings
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/.fastembed_cache
          # La key cuelga del módulo que fija el modelo: si cambia `MODELO`, el cache viejo
          # deja de servir y se baja el nuevo.
          key: fastembed-${{ hashFiles('app/core/embeddings.py') }}

      - name: Instalar dependencias
        run: uv sync --frozen --extra dev

      - name: Ruff (lint)
        run: uv run --frozen ruff check .

      - name: Ruff (formato)
        run: uv run --frozen ruff format --check .

      # No hace falta sembrar roles ni correr scripts/init_db.sql: conftest crea `app_user`
      # y la base de tests, y la migración 0003 crea `app_readonly` con sus grants. Los
      # defaults de conftest ya apuntan a localhost:5432 con postgres/postgres.
      - name: Tests
        run: uv run --frozen pytest -q

  frontend:
    name: frontend (lint + test + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # `--frozen-lockfile`: instala EXACTO lo que dice bun.lock y falla si package.json y el
      # lock no coinciden. Es la diferencia entre probar lo que tenés y probar lo que había hoy.
      - name: Instalar dependencias
        run: bun install --frozen-lockfile

      - name: Oxlint
        run: bun run lint

      # `bun run test` invoca el script `test` (vitest run) — NO `bun test`, que usaría el
      # runner propio de Bun e ignoraría la config de vitest. `vitest run` corre una vez y sale.
      - name: Tests
        run: bun run test

      # `build` es `tsc -b && vite build`: typecheck completo + bundle. Ataja imports rotos y
      # errores de tipo que los tests unitarios no ven.
      - name: Build
        run: bun run build

  # Los dos jobs de abajo SOLO corren en push a main, y solo si backend+frontend pasaron
  # (needs). Antes las migraciones corrían en el CMD del contenedor de Render en cada
  # arranque: si la base no respondía (ej. Supabase pausada), alembic fallaba y el proceso
  # nunca llegaba a levantar uvicorn — una pausa recuperable se volvía una caída total. Ahora
  # migrar es un paso explícito de CI, y Render solo deployea lo que ya migró (render.yaml:
  # autoDeploy: false). Ver docs/deploy.md.
  migrate:
    name: migrar (alembic upgrade head)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Instalar dependencias
        run: uv sync --frozen --no-dev

      # Runners de GitHub: IPv4-only. La conexión directa de Supabase (db.<ref>.supabase.co)
      # es IPv6-only — el secret TIENE que ser el pooler en session mode, puerto 5432
      # (aws-0-<region>.pooler.supabase.com:5432), nunca el 6543 (transaction mode: rompe DDL
      # y prepared statements). `DATABASE_URL` se fija igual porque Settings la exige, pero
      # `env.py` prioriza MIGRATIONS_DATABASE_URL (ver alembic/env.py) — el valor es el mismo
      # a propósito.
      - name: Migrar producción
        env:
          DATABASE_URL: ${{ secrets.MIGRATIONS_DATABASE_URL }}
          MIGRATIONS_DATABASE_URL: ${{ secrets.MIGRATIONS_DATABASE_URL }}
        run: uv run --frozen alembic upgrade head

  deploy:
    name: desplegar (Render deploy hook)
    runs-on: ubuntu-latest
    needs: migrate
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      # `-f`: si Render devuelve un status de error, el step falla (y no queda un "verde"
      # mintiendo). El hook dispara el build+deploy de la imagen que YA migró arriba.
      - name: Disparar el deploy en Render
        run: curl -fsS "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
